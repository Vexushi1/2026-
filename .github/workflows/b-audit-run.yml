name: Run B audit pipeline

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/b-audit-run.yml"

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout audit branch
        uses: actions/checkout@v4
        with:
          ref: b-audit-preprocess
          fetch-depth: 0
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy scipy scikit-learn tabulate
      - name: Run audit
        run: python "B题数据审计与预处理.py"
      - name: Commit outputs to audit branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "结果数据表/数据审计与预处理" "预处理数据"
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Generate B problem audit and preprocessing results [skip ci]"
            git push origin HEAD:b-audit-preprocess
          fi
