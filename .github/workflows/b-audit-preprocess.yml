name: B题数据审计与预处理

on:
  push:
    branches:
      - b-audit-preprocess
    paths-ignore:
      - "结果数据表/**"
      - "预处理数据/**"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  audit-preprocess:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: 检出仓库
        uses: actions/checkout@v4
        with:
          ref: b-audit-preprocess
          fetch-depth: 0

      - name: 配置Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy scipy scikit-learn tabulate

      - name: 执行数据审计与预处理
        run: python "B题数据审计与预处理.py"

      - name: 提交审计结果
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "结果数据表/数据审计与预处理" "预处理数据"
          if git diff --cached --quiet; then
            echo "结果无变化，无需提交"
          else
            git commit -m "Generate B problem audit and preprocessing results [skip ci]"
            git push origin HEAD:b-audit-preprocess
          fi
